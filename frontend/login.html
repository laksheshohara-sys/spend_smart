<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SpendSmart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
        }

        .auth-bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 70% 50% at 30% 40%, rgba(108,99,255,0.15) 0%, transparent 65%),
                        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(16,185,129,0.08) 0%, transparent 60%);
        }

        .auth-card {
            position: relative;
            z-index: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo {
            font-family: var(--font-head);
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent2), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo span { color: var(--green); -webkit-text-fill-color: var(--green); }

        .auth-sub {
            text-align: center;
            color: var(--text2);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .auth-form { display: flex; flex-direction: column; gap: 18px; }

        .divider {
            text-align: center;
            color: var(--text3);
            font-size: 0.85rem;
            margin: 8px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: var(--radius-sm);
            color: #F87171;
            padding: 10px 14px;
            font-size: 0.88rem;
            display: none;
        }

        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }
    </style>
</head>
<body>
    <script src="utils/api.js"></script>
    <script src="components/navbar.js"></script>
    <script>
        redirectIfLoggedIn();
        renderNavbar('login');
    </script>

    <div class="auth-wrapper">
        <div class="auth-bg"></div>
        <div class="auth-card fade-in">
            <div class="auth-logo">Spend<span>Smart</span></div>
            <p class="auth-sub">Welcome back! Sign in to your account</p>

            <div class="error-box" id="error-box"></div>

            <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="input" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-full" id="submit-btn">
                    Sign In
                </button>
            </form>

            <div class="divider" style="margin-top:24px;">or</div>

            <p style="text-align:center;margin-top:16px;font-size:0.9rem;color:var(--text2);">
                Don't have an account? 
                <a href="register.html" style="color:var(--accent2);font-weight:600;">Create one →</a>
            </p>

            <!-- Demo credentials -->
            <div style="margin-top:24px;padding:14px;background:var(--bg3);border-radius:var(--radius-sm);font-size:0.82rem;color:var(--text3);text-align:center;border:1px dashed var(--border);">
                <strong style="color:var(--text2);">Demo:</strong> demo@SpendSmart.com / demo123
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn     = document.getElementById('submit-btn');
            const errBox  = document.getElementById('error-box');
            const email   = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.innerHTML = '<span class="spinner"></span> Signing in…';
            btn.disabled  = true;
            errBox.style.display = 'none';

            try {
                await Auth.login(email, password);
                showToast('Welcome back! 👋', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 600);
            } catch (err) {
                errBox.textContent = err.message;
                errBox.style.display = 'block';
                btn.innerHTML = 'Sign In';
                btn.disabled  = false;
            }
        }
    </script>
</body>
</html>
